name: RemiMinder
description: A healthcare companion app for patients and caregivers
version: 1.4.7+76

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2

  # State Management
  flutter_riverpod: ^3.1.0

  # Navigation
  go_router: ^17.0.1
  app_links: ^6.4.0

  # Networking & Authentication
  http: ^1.1.0
  url_launcher: ^6.3.1
  google_sign_in: ^6.2.1
  flutter_dotenv: ^6.0.0

  # Firebase
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  firebase_messaging: ^16.1.0
  flutter_timezone: ^3.0.0
  cloud_firestore: ^6.0.0

  # Secure Storage (for JWT tokens)
  flutter_secure_storage: ^10.0.0

  # Local Storage (for app preferences)
  shared_preferences: ^2.2.2

  # Utils
  intl: ^0.20.2
  google_fonts: ^6.2.1
  table_calendar: ^3.1.3

  # Localization
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.0.9
  jwt_decoder: ^2.0.1
  equatable: ^2.0.5
  crypto: ^3.0.3
  uuid: ^4.2.1
  encrypt: ^5.0.1

  # Charts
  fl_chart: ^1.1.1

  # Local notifications (reminders when app is closed)
  flutter_local_notifications: ^18.0.0
  timezone: ^0.9.4

  # Permissions & Media
  permission_handler: ^12.0.1
  camera: 0.10.6
  record: 6.1.2
  web_socket_channel: ^3.0.2
  speech_to_text: ^7.3.0
  image_picker: ^1.1.1
  path_provider: ^2.1.2
  sign_in_with_apple: ^8.0.0
  purchases_flutter: ^10.6.0
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icon.png
    - assets/app_icon.png
    - .env
    - assets/images/google_logo.svg
    - assets/images/patient_icon.svg
    - assets/images/caregiver_icon.svg

  fonts:
    - family: Merriweather
      fonts:
        - asset: assets/fonts/Merriweather-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_28pt-Regular.ttf
        - asset: assets/fonts/Inter_28pt-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter_28pt-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter_28pt-Bold.ttf
          weight: 700
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf

flutter_launcher_icons:
  ios: true
  image_path: "assets/app_icon.png"
  remove_alpha_ios: true
  background_color_ios: "#F8F4E8"
  adaptive_icon_background: "#F8F4E8"
  adaptive_icon_foreground: "assets/app_icon.png"
  android: "launcher_icon"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/app_icon.png"
    background_color: "#F8F4E8"
    theme_color: "#1B4E59"

dependency_overrides:
  camera_android_camerax: 0.6.18+1
